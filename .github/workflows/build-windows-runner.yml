name: Build Windows Runner

on:
  push:
    branches:
      - master
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout synced Paperclip source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: packages/paperclip-runner/runner/target
          key: windows-runner-${{ hashFiles('packages/paperclip-runner/runner/Cargo.lock', 'packages/paperclip-runner/rust-toolchain.toml') }}

      - name: Build Windows runner
        working-directory: packages/paperclip-runner
        run: cargo build --release --manifest-path runner/Cargo.toml --locked -p paperclip-runner-core --bin paperclip-runnerd

      - name: Prepare verified runner artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDir = Join-Path $env:RUNNER_TEMP 'paperclip-runner-artifact'
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null
          $runner = Join-Path $env:GITHUB_WORKSPACE 'packages/paperclip-runner/runner/target/release/paperclip-runnerd.exe'
          if (-not (Test-Path -LiteralPath $runner -PathType Leaf)) {
            throw "The Windows runner build did not produce $runner"
          }
          $destination = Join-Path $artifactDir 'paperclip-runnerd.exe'
          Copy-Item -LiteralPath $runner -Destination $destination
          $hash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          $receipt = [ordered]@{
            schema = 'paperclip.runner.prebuilt.v1'
            sourceRevision = '${{ github.sha }}'
            platform = 'win32'
            architecture = 'x64'
            sha256 = $hash
          } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText((Join-Path $artifactDir 'receipt.json'), $receipt, [System.Text.UTF8Encoding]::new($false))

      - name: Upload runner for this source revision
        uses: actions/upload-artifact@v4
        with:
          name: paperclip-runner-win32-x64
          path: ${{ runner.temp }}/paperclip-runner-artifact/
          if-no-files-found: error
          retention-days: 30
