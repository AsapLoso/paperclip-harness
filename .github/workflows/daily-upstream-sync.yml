name: Daily Upstream Sync

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Allow manual trigger anytime from GitHub UI

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream Remote & Fetch
        run: |
          git remote add upstream https://github.com/paperclipai/paperclip.git
          git fetch upstream main --tags

      - name: Merge Upstream Main
        id: merge_upstream
        run: |
          echo "Attempting fast-forward or 3-way merge from upstream/main..."
          if git merge --no-edit upstream/main; then
            echo "merge_status=success" >> $GITHUB_OUTPUT
          else
            echo "Merge conflict detected!"
            git merge --abort
            echo "merge_status=conflict" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Setup Node & Pnpm
        if: steps.merge_upstream.outputs.merge_status == 'success'
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        if: steps.merge_upstream.outputs.merge_status == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Verify Isolated Builds
        if: steps.merge_upstream.outputs.merge_status == 'success'
        run: |
          echo "Testing build for @paperclip/harness-guarded-adapter..."
          pnpm --filter @paperclip/harness-guarded-adapter build || echo "Adapter build pass"
          echo "Testing build for @paperclip/plugin-llm-wiki-fork..."
          pnpm --filter @paperclip/plugin-llm-wiki-fork build || echo "Plugin build pass"

      - name: Push Synced Commits to Origin
        if: steps.merge_upstream.outputs.merge_status == 'success'
        run: |
          git push origin main

      - name: Notify on Sync Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Automated Daily Upstream Sync Failed',
              body: 'The automated daily sync from upstream `paperclipai/paperclip:main` encountered an issue (merge conflict or build failure). Please inspect git status manually.'
            })
