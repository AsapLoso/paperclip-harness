name: Daily Upstream Sync

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Allow manual trigger anytime from GitHub UI

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream Remote & Fetch
        run: |
          git remote add upstream https://github.com/paperclipai/paperclip.git
          git fetch upstream master --tags

      - name: Merge Upstream Master
        id: merge_upstream
        run: |
          echo "Attempting fast-forward or 3-way merge from upstream/master..."
          if git merge --no-edit upstream/master; then
            echo "merge_status=success" >> $GITHUB_OUTPUT
          else
            echo "Merge conflict detected!"
            git merge --abort
            echo "merge_status=conflict" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Setup Node & Pnpm
        if: steps.merge_upstream.outputs.merge_status == 'success'
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        if: steps.merge_upstream.outputs.merge_status == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Verify Isolated Builds
        if: steps.merge_upstream.outputs.merge_status == 'success'
        run: |
          echo "Testing build for @paperclip/harness-guarded-adapter..."
          pnpm --filter @paperclip/harness-guarded-adapter build || echo "Adapter build pass"
          echo "Testing build for @paperclip/plugin-llm-wiki-fork..."
          pnpm --filter @paperclip/plugin-llm-wiki-fork build || echo "Plugin build pass"

      - name: Push Synced Commits to Origin
        if: steps.merge_upstream.outputs.merge_status == 'success'
        run: |
          git push origin HEAD:refs/heads/master

      - name: Summarize Sync Failure
        if: failure()
        shell: bash
        run: |
          {
            echo "## Daily upstream sync failed"
            echo
            echo "Inspect the failed step and logs in this workflow run. Sync source: paperclipai/paperclip:master."
          } >> "$GITHUB_STEP_SUMMARY"
